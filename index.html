<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ramble electronics workbench</title>
    <meta name="description" content="Build and simulate circuits with 3D electronic components." />
    <style>
      :root {
        --bg: #0f1216;
        --panel: #171b21;
        --line: #2a313b;
        --text: #e6e9ee;
        --dim: #8a93a0;
        --accent: #4cc38a;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid: auto 1fr auto / 15rem 1fr 18rem;
        grid-template-areas: 'top top top' 'lib view side' 'bar bar bar';
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      header,
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--line);
      }
      header {
        grid-area: top;
      }
      footer {
        grid-area: bar;
        color: var(--dim);
      }
      aside {
        grid-area: lib;
        overflow: auto;
        padding: 0.75rem;
        background: var(--panel);
      }
      #side {
        grid-area: side;
      }
      main {
        grid-area: view;
        position: relative;
        overflow: hidden;
        min-height: 18rem;
      }
      main:not(.ready)::after {
        content: 'Loading 3D…';
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--dim);
      }
      button,
      input {
        font: inherit;
        color: inherit;
        padding: 0.3rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--panel);
      }
      #parts button {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        width: 100%;
        margin: 0.15rem 0;
        text-align: left;
      }
      #parts svg {
        flex: none;
        width: 2.2rem;
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.5;
      }
      #search {
        width: 100%;
      }
      h1,
      h2 {
        margin: 0 auto 0 0;
        font-size: 1rem;
      }
      h3 {
        margin: 1rem 0 0.25rem;
        font-size: 0.75rem;
        color: var(--dim);
      }
      code {
        display: block;
        padding: 0.5rem;
        background: var(--bg);
      }
      @media (max-width: 800px) {
        body {
          height: auto;
          grid: auto 60vh auto auto auto / 1fr;
          grid-template-areas: 'top' 'view' 'side' 'lib' 'bar';
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Ramble</h1>
      <span id="tools"></span>
    </header>
    <aside>
      <input id="search" type="search" placeholder="Search parts" aria-label="Search parts" />
      <div id="parts">Loading parts…</div>
    </aside>
    <main id="view" data-app="/src/app.ts"></main>
    <aside id="side">
      <div id="inspect"></div>
      <div id="learn"><p>Choose a part to learn how it works.</p></div>
    </aside>
    <footer><span id="hint">Loading…</span><span id="warn"></span></footer>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
